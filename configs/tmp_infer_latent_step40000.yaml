# ========== 模型（1通道 latent LDM） ==========
vae_repo: "/workspace/latent-v2/experiments/train_vae/final"
unet_ckpt: "/workspace/latent-v2/experiments/train_unet_with_vae/unet_step40000.pt"
numeric_ckpt: "/workspace/latent-v2/experiments/train_unet_with_vae/numeric_enc_step40000.pt"

unet_arch:
  sample_size: 32              # = image_size // 8
  in_channels: 1               # latent 1 通道
  out_channels: 1
  down_block_types: ["DownBlock2D","DownBlock2D","DownBlock2D","DownBlock2D"]
  up_block_types:   ["UpBlock2D","UpBlock2D","UpBlock2D","UpBlock2D"]
  block_out_channels: [128, 256, 256, 256]
  layers_per_block: 2
  cross_attention_dim: 768
  attention_head_dim: 8

# NumericEncoder 维度（与训练一致）
cond_dim: 3
hidden_size: 768
seq_len: 16

# ========== 数据 ==========
real_dir: "/workspace/latent-v2/dataset_split/test"               # 里面 *.txt，有 signal_b50 / signal_b800
out_dir: "/workspace/latent-v2/runs/latent_without_cfg/step40000"

# ========== 采样 ==========
steps: 30      # DDIM 迭代步数
height: 256    # 和训练时一致
width:  256
eta: 0.0       # 先不管，DDIM里一般设 0

scheduler:
  num_train_timesteps: 1000
  beta_start: 0.00085
  beta_end: 0.012
  beta_schedule: "scaled_linear"

seed: 123
batch_size: 1
