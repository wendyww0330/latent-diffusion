# ========== 模型 ckpt ==========
unet_ckpt: "/workspace/latent-v2/experiments/train_ddpm/unet_step80000.pt"
numeric_ckpt: "/workspace/latent-v2/experiments/train_ddpm/numeric_enc_step80000.pt"

# 必须与训练时一致
cond_dim: 3
hidden_size: 768
seq_len: 16

unet:
  sample_size: 256          # = image_size
  in_channels: 1
  out_channels: 1
  down_block_types: ["DownBlock2D","DownBlock2D","DownBlock2D","DownBlock2D"]
  up_block_types:   ["UpBlock2D","UpBlock2D","UpBlock2D","UpBlock2D"]
  block_out_channels: [128, 128, 256, 256]
  layers_per_block: 2
  cross_attention_dim: 768
  attention_head_dim: 8

# ========== 数据与输出 ==========
real_dir: "/workspace/latent-v2/dataset_split/test"        # sidecar .txt with signal_b50 / signal_b800
out_dir: "/workspace/latent-v2/runs/ddpm_without_cfg/step80000"
image_size: 256

# ========== 采样（无 CFG） ==========
steps: 30          # DDPM 推理步数（越大越接近训练分布，越慢）
batch_size: 1
seed: 123

scheduler:
  num_train_timesteps: 1000
  beta_start: 0.00085
  beta_end: 0.012
  beta_schedule: "scaled_linear"
