# path
train_dir: "/workspace/train_data_cont"     # .txt + img
out_dir:   "/workspace/experiments/pixel_unet_numeric_more_steps"
image_size: 256                             
batch_size: 4
num_workers: 4
seed: 123

# NumericEncoder
cond_dim: 2            # [b50, b800]
hidden_size: 768       
seq_len: 16

# UNet
unet:
  sample_size: 256     # image_size 
  in_channels: 1       # 1 gray
  out_channels: 1      # noise
  down_block_types: ["DownBlock2D","DownBlock2D","DownBlock2D","DownBlock2D"]
  up_block_types:   ["UpBlock2D","UpBlock2D","UpBlock2D","UpBlock2D"]
  block_out_channels: [128, 128, 256, 256]
  layers_per_block: 2
  cross_attention_dim: 768
  attention_head_dim: 8

# optim
lr: 5e-5               # traing 3 from last experiment
max_steps: 50000
warmup: 500
save_every: 2000
log_every: 50

# scheduler DDPM
scheduler:
  num_train_timesteps: 1000
  beta_start: 0.00085
  beta_end: 0.012
  beta_schedule: "scaled_linear"
