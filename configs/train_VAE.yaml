model:
  params:
    embed_dim: 1
    kl_weight: 1.0e-6
    ddconfig:
      double_z: true
      z_channels: 1
      resolution: 256           # resolution
      in_channels: 1
      out_ch: 1
      ch: 128
      ch_mult: [1, 2, 4, 4]
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0

data:
  image_size: 256
  train_dir: "./dataset_split/train"   # path
  batch_size: 4
  num_workers: 4
  normalize_mean: [0.5]
  normalize_std:  [0.5]

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-5
  max_steps: 20000
  warmup: 2000
  save_every: 5000
  log_every: 100
  out_dir: "./experiments/train_vae"
